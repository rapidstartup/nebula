<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula - Cosmic Innovation Hub</title>
    <!-- styles.css link removed, will be handled by React app's CSS imports -->
</head>
<body>
    <!-- Animated background (kept as it might be global) -->
    <div class="cosmic-background">
        <div class="stars"></div>
        <div class="nebula-layer-1"></div>
        <div class="nebula-layer-2"></div>
        <div class="floating-particles"></div>
    </div>

    <!-- Root element for React application -->
    <div id="root"></div>

    <!-- Script to load the React application -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- script.js link removed, JS logic will be in React components -->
    <!-- VibeDash support widget -->
    <script>
      (function () {
        var script = document.createElement('script');
        script.src = 'https://vibedash.app/embed-vanilla.js';
        script.async = true;
        script.onload = function () {
          window.VibeDashFeedback && window.VibeDashFeedback.init({
            projectId: '20a02ecf-cb3c-4a3a-b646-caddbb885078',
            webhookUrl: 'https://vibedash.app/.netlify/functions/submit-ticket/20a02ecf-cb3c-4a3a-b646-caddbb885078'
          });
        };
        document.head.appendChild(script);
      })();
    </script>
</body>
</html>
